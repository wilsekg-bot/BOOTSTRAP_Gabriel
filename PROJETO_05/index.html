<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 05 - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <div class="container my-5">
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            <strong>Bem-vindo!!!</strong>Você chegou ao projeto final da trilha de bootsTrap
            <button class="btn-close" type="button" data-bs-dismiss="alert"></button>
        </div>
        <!--Cabeçalho com botão de modal-->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestão de projetos</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="modalNovoProjeto">
                + Novo Projeto
            </button>
        </div>

        <!--Tabela Responsiva-->
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Projeto</th>
                            <th>Conceito Principal</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>01. Cartão de Perfil</td>
                            <td>Containers e Espaçamento</td>
                            <td><span class="badge bg-success">Concluído</span></td>
                            <td><button class="btn btn-sm btn-outline-primary">Ver</button></td>
                        </tr>
                        <tr></tr>
                        <tr></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
</body>

</html>
