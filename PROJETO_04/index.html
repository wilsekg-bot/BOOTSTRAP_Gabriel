<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 04 - Formulários</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h3 class="mb-4">Criar Conta</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" placeholder="João" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label">Sobrenome</label>
                                <input type="text" class="form-control" placeholder="Silva" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Usuário</label>
                                <div class="input-group">
                                    <span class="input-group-text">@</span>
                                    <input type="text" class="form-control" placeholder="joaosilva">
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Área de Interesse</label>
                                <select class="form-select">
                                    <option selected>Escolha uma opção</option>
                                    <option value="1">Front-end</option>
                                    <option value="2">Back-end</option>
                                    <option value="3">Full-stack</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <div class="from-check">
                                    <input type="checkbox" class="from-check-input" id="termos">
                                    <label for="termos" class="form-check-label">
                                        concordo com os termos de uso.
                                    </label>
                                </div>
                            </div>

                            <div class="col-12 mt-4">

                                <button class="btn btn-success w-100" type="submit">Finalizar cadastro</button>

                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
