<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 01 - Cartão de perfil 👌</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card mx-auto shadow-sm" style="max-width: 400px;">
            <div class="card-body text-center p-4">
                <img src="https://via.placeholder.com/120" class="rounded-circle mb-3 border border-3 border-primary"
                    alt="Foto de perfil">
                <h3 class="card-title fw-bold">
                    Seu nome aqui:
                </h3>
                <p class="text-muted mb-3">
                    Desenvolvedor(a) Front-end em formação
                </p>
                <p class="card-text">
                    Aprendendo a criar interfaces responsivas e modernas utilizando o sistema de classes do Bootstrap 5.
                </p>
                <div class="d-grid gap-2">
                    <a href="#" class="btn btn-primary">Portifólio</a>
                    <a href="#" class="btn btn-outline-secondary">LinkedIn</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
