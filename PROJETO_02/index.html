<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 02 - Grid Responsivo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container my-5">
        <h2 class="text-center mb-4">Galeria Responsiva</h2>

        <!-- adiciona espaçamento (gutter) entre as colunas-->
         <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/400x250/0d6efd/ffffff?text=Foto+1" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5 class="card-title">Item 1</h5>
                        <p class="card-text">Redimensione a janela do navegador para ver as colunas se reorganizando</p>
                    </div>
                </div>

            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/400x250/198754/ffffff?text=Foto+2" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5 class="card-title">Item 2</h5>
                        <p class="card-text">A classe h-100 garante que todos os cards tenham a mesma altura</p>
                    </div>
                </div>

            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/400x250/dc3545/ffffff?text=Foto+3" class="card-img-top" alt="">
                    <div class="card-body">
                        <h5 class="card-title">Item 3</h5>
                        <p class="card-text">O sistema de 12 colunas facilita o alinhamento perfeito</p>
                    </div>
                </div>

            </div>

         </div>

    </div>
    
</body>
</html>
